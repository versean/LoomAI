<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>

<!-- Signed out: the CLI opens this page with a one-time #login= code -->
<main class="gate" id="gate" hidden>
  <div class="gate-card">
    <img class="gate-mark" src="/assets/loom-mark.png" alt="">
    <h1>Your team dashboard</h1>
    <p id="gateMsg">Open it from your terminal. It signs you in with a one-time link that expires after two minutes.</p>
    <div class="codebox"><code>loom dashboard</code><button class="btn sm copy" data-copy="loom dashboard">Copy</button></div>
  </div>
</main>

<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="tb-left">
      <a class="brand" href="#/home"><img src="/assets/loom-mark.png" alt="">Loom</a>
      <span class="team-chip" id="teamChip"></span>
    </div>
    <div class="tb-right">
      <button class="search-btn" id="searchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Ask the brain</span><kbd>Ctrl K</kbd></button>
      <span class="live" id="live" data-state="connecting"><i></i><span>Connecting</span></span>
      <button class="btn primary" id="inviteBtn">+ Invite</button>
      <span class="me" id="me" title=""></span>
    </div>
  </header>

  <div class="body">
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
