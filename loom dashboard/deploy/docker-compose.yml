# Production stack for one AWS instance (EC2 or Lightsail):
#   hivemind  the hub (port 4100, internal only)
#   caddy     HTTPS in front of it, automatic Let's Encrypt certificate
#
# Usage (on the server, from this folder):
#   cp ../.env.example .env   # then fill it in
#   docker compose up -d --build

services:
  hivemind:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      HIVEMIND_DATA_DIR: /data
    volumes:
      - /srv/hivemind:/data            # persistent: brain git repo + SQLite
    expose:
      - "4100"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HIVEMIND_DOMAIN: ${HIVEMIND_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hivemind

volumes:
  caddy_data:
  caddy_config:
