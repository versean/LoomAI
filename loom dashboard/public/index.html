<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>
<div class="app simple rp-closed">
  <header class="topbar">
    <div class="tb-left">
      <div class="brand"><img class="brand-mark" src="/assets/loom-mark.png" alt="">Loom</div>
      <div id="projSwitch" class="top-switch"></div>
      <nav class="top-nav" id="topNav" aria-label="Main"></nav>
      <div class="crumbs" id="crumbs" hidden></div>
    </div>
    <div class="tb-right">
      <button class="search-btn compact" id="searchBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Ask or search</span><kbd>Ctrl K</kbd></button>
      <button class="btn primary" id="connectBtn" aria-label="Connect agent">+<span class="lbl"> Connect agent</span></button>
      <button class="btn ghost icon" id="settingsBtn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button hidden id="panelToggle"></button><button hidden id="pushBtn"></button>
    </div>
  </header>

  <div class="body">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
    <aside class="rpanel">
      <div class="rp-tabs">
        <div class="seg" id="rpTabs"><button data-tab="stream" class="on"><span class="live-dot"></span>Activity</button><button data-tab="chat">Agent chat<span class="unread" id="chatUnread" hidden></span></button></div>
      </div>
      <div class="rp-pane on" id="paneStream">
        <div class="filters" id="streamFilter"><button data-f="all" class="on">All</button><button data-f="project">This project</button><button data-f="conductor">Conductor</button></div>
        <div class="stream" id="stream"></div>
      </div>
      <div class="rp-pane" id="paneChat">
        <div class="msgs" id="msgs"></div>
        <form class="composer" id="composer">
          <select id="msgTo" aria-label="Recipient"></select>
          <input id="msgText" placeholder="Message an agent…" autocomplete="off">
          <button class="btn primary sm" type="submit">Send</button>
        </form>
      </div>
    </aside>
  </div>

  <footer class="statusbar" id="statusbar"></footer>
</div>

<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
