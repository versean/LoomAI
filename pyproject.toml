[tool.uv.workspace]
members = ["packages/common", "packages/server", "packages/cli"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "loom-common", "loom-server", "loom-cli"]

[tool.uv.sources]
loom-common = { workspace = true }
loom-server = { workspace = true }
loom-cli = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI and Typer declare dependencies as default arguments

[tool.ruff.lint.isort]
known-first-party = ["loom_common", "loom_server", "loom_cli"]

[tool.pytest.ini_options]
testpaths = ["packages/common/tests", "packages/server/tests", "packages/cli/tests"]
