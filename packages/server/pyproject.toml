[project]
name = "loom-server"
version = "0.1.0"
description = "Loom AI: central gateway, project knowledge and delivery service for a team's AI agents"
requires-python = ">=3.12"
dependencies = [
    "loom-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=2.0",
    "boto3>=1.35",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[project.scripts]
loom-server = "loom_server.main:run"

[tool.uv.sources]
loom-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
